[tool.pytest.ini_options]
addopts = "--cov --cov-report=term-missing"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = [
  "bot",
  "chatgpt_runtime",
  "config",
  "schedule_runtime",
  "telegram_access",
  "telegram_mcp",
]

[tool.coverage.report]
fail_under = 50
show_missing = true
